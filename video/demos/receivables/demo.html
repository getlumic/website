<!DOCTYPE html>
<!-- lumic demo film: Receivables. Real dashboard screens, scrambled at capture (video/demos/capture_live.py: no real numbers or names)
     moved by a code camera. Deterministic: window.seek(t) draws the frame for time t. Render: python video/demos/render.py receivables -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#f6f6fb}
body{font-family:"Instrument Sans",sans-serif;color:#0f172a;-webkit-font-smoothing:antialiased}
em{font-family:"Instrument Serif",serif;font-weight:400;font-style:italic;color:#5e5ce6;letter-spacing:-.005em}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse 60% 55% at 50% 42%,rgba(94,92,230,.13),transparent 70%),#f6f6fb}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(94,92,230,.16) 1.3px,transparent 1.5px);background-size:28px 28px;
  -webkit-mask-image:radial-gradient(ellipse 75% 70% at 50% 45%,#000 0%,transparent 75%)}
.title{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.pill{display:inline-flex;align-items:center;gap:10px;font-size:20px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#5e5ce6;
  padding:10px 20px;border-radius:999px;background:#fff;box-shadow:0 0 0 1px rgba(94,92,230,.22)}
.pill i{width:8px;height:8px;border-radius:50%;background:#5e5ce6}
.title h1{margin-top:30px;font-size:96px;font-weight:500;letter-spacing:-.035em;line-height:1.04}
.win{position:absolute;left:240px;top:72px;width:1440px;height:940px;border-radius:16px;overflow:hidden;background:#fff;
  box-shadow:0 0 0 1px rgba(15,23,42,.08),0 40px 90px -20px rgba(15,23,42,.28),0 12px 30px -10px rgba(94,92,230,.18)}
.bar{position:absolute;left:0;right:0;top:0;height:40px;background:#fbfbfd;border-bottom:1px solid #e9ebf2;display:flex;align-items:center;padding:0 18px}
.bar b{width:12px;height:12px;border-radius:50%;background:#e2e5ee;margin-right:8px}
.bar span{position:absolute;left:0;right:0;text-align:center;font-size:15px;color:#64748b;font-weight:500}
.bar .tag{position:absolute;right:16px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#5e5ce6;
  background:#eeedfd;padding:4px 10px;border-radius:999px}
.view{position:absolute;left:0;top:40px;width:1440px;height:900px;overflow:hidden;background:#f8fafc}
.stage{position:absolute;left:0;top:0;width:1440px;height:900px;transform-origin:0 0}
.stage img{position:absolute;left:0;top:0;width:1440px;height:900px}
.ring{position:absolute;border-radius:10px;box-shadow:0 0 0 3px #5e5ce6,0 0 0 9px rgba(94,92,230,.18);opacity:0}
.cursor{position:absolute;left:0;top:0;width:34px;height:34px;opacity:0;filter:drop-shadow(0 3px 6px rgba(15,23,42,.35))}
.ripple{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:3px solid #5e5ce6;opacity:0}
.cap{position:absolute;left:0;right:0;bottom:44px;display:flex;justify-content:center;pointer-events:none}
.cap div{display:inline-flex;align-items:center;gap:14px;background:rgba(15,23,42,.92);color:#fff;font-size:28px;font-weight:500;letter-spacing:-.01em;
  padding:16px 30px;border-radius:999px;box-shadow:0 18px 40px -12px rgba(15,23,42,.5);opacity:0}
.cap div i{width:10px;height:10px;border-radius:50%;background:#8b8af0;box-shadow:0 0 12px 2px rgba(139,138,240,.7)}
.end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0}
.end h2{font-size:92px;font-weight:500;letter-spacing:-.035em;line-height:1.05}
.end .wm{height:46px;margin-top:56px}
.end .url{margin-top:18px;font-size:20px;font-weight:600;letter-spacing:.2em;color:#64748b}
</style>
</head>
<body>
<div class="bg"></div><div class="dots"></div>

<div class="title" id="title">
  <div class="pill" id="kick"><i></i>Receivables</div>
  <h1 id="h1">Who owes us money, <em>right now?</em></h1>
</div>

<div class="win" id="win">
  <div class="bar"><b></b><b></b><b></b><span>Northwind Supply Co. &nbsp;·&nbsp; Receivables</span><em class="tag" style="font-family:inherit;font-style:normal">Sample data</em></div>
  <div class="view" id="view">
    <div class="stage" id="stage">
      <img id="s0" src="../shots/receivables/overview.png" alt="">
      <img id="s1" src="../shots/receivables/aging.png" alt="">
      <img id="s2" src="../shots/receivables/customer.png" alt="">
      <div class="ring" id="ring"></div>
    </div>
    <div class="ripple" id="rip"></div>
    <svg class="cursor" id="cur" viewBox="0 0 24 24"><path d="M5 2.5v17.2l4.6-4.3 2.9 6.6 2.7-1.2-2.9-6.5H19z" fill="#0f172a" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>
    <div class="cap"><div id="cap0"><i></i>Every open balance, live. No report to run.</div></div>
    <div class="cap"><div id="cap1"><i></i>See who is late, and by how much.</div></div>
    <div class="cap"><div id="cap2"><i></i>Every invoice, note, and statement in one place.</div></div>
  </div>
</div>

<div class="end" id="end">
  <h2>Your receivables, <em>kept current.</em></h2>
  <img class="wm" src="../../../public/wordmark.svg" alt="lumic">
  <div class="url">GET-LUMIC.COM</div>
</div>

<script>
const DURATION = 23;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const P = (t, a, b) => clamp((t - a) / (b - a), 0, 1);                    // linear progress of t through [a, b]
const io = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;   // ease in-out cubic
const out = x => 1 - Math.pow(1 - x, 3);
const fade = (t, a, b, c, d) => out(P(t, a, b)) * (1 - io(P(t, c, d)));    // in over [a,b], out over [c,d]

/* Camera keys [t, cx, cy, zoom] in screenshot CSS px (1440x900). */
const CAM = [
  [0, 720, 450, 1], [4.0, 720, 450, 1], [5.6, 560, 150, 1.9], [6.9, 560, 150, 1.9], [7.8, 520, 240, 1.75],
  [8.8, 430, 260, 1.35], [10.2, 860, 250, 1.12], [11.8, 860, 250, 1.12], [12.8, 640, 420, 1.55],
  [14.4, 640, 420, 1.55], [15.6, 900, 250, 1.22], [17.2, 900, 250, 1.22], [18.6, 720, 450, 1], [99, 720, 450, 1]];
/* Cursor keys [t, x, y] in screenshot CSS px; shown 6.6-14.2. */
const CUR = [[0, 760, 300], [6.6, 760, 300], [7.4, 560, 232], [8.0, 560, 232], [8.6, 70, 224],
  [9.4, 70, 224], [10.6, 740, 560], [12.4, 740, 560], [13.2, 330, 388], [99, 330, 388]];
const CLICKS = [8.65, 13.55, 13.75];

function keyed(keys, t) {
  let i = 0;
  while (i < keys.length - 2 && t >= keys[i + 1][0]) i++;
  const a = keys[i], b = keys[i + 1], u = io(P(t, a[0], b[0]));
  return a.slice(1).map((v, k) => k === 2 && a.length === 4 ? Math.exp(Math.log(v) + (Math.log(b[k + 1]) - Math.log(v)) * u) : v + (b[k + 1] - v) * u);
}
function camera(t) {
  const [cx, cy, z] = keyed(CAM, t);
  const tx = clamp(720 - cx * z, 1440 - 1440 * z, 0), ty = clamp(450 - cy * z, 900 - 900 * z, 0);
  return { tx, ty, z };
}

function draw(t) {
  // title, then the window rises in; at the end the window sinks away and the end card fades up
  const tOut = io(P(t, 2.0, 2.7));
  $('title').style.opacity = fade(t, 0, .6, 2.0, 2.6);
  $('title').style.transform = `translateY(${(1 - out(P(t, 0, .9))) * 24 - tOut * 40}px)`;
  const wIn = out(P(t, 2.2, 3.2)), wOut = io(P(t, 19.0, 20.0));
  $('win').style.opacity = wIn * (1 - wOut);
  $('win').style.transform = `translateY(${(1 - wIn) * 70 + wOut * 40}px) scale(${(.94 + .06 * wIn) * (1 - .04 * wOut)})`;
  $('end').style.opacity = fade(t, 19.7, 20.6, 22.3, 23);
  $('end').style.transform = `translateY(${(1 - out(P(t, 19.7, 20.8))) * 24}px)`;

  // screens: overview -> aging (click at 8.65) -> customer (double-click at 13.75)
  $('s1').style.opacity = io(P(t, 8.85, 9.25));
  $('s2').style.opacity = io(P(t, 13.95, 14.35));

  const c = camera(t);
  $('stage').style.transform = `translate(${c.tx}px,${c.ty}px) scale(${c.z})`;

  // highlight ring on the first aging row (Glow Standard Beauty, row box 287,365 1153x43)
  const ring = $('ring');
  Object.assign(ring.style, { left: '289px', top: '366px', width: '1149px', height: '41px' });
  ring.style.opacity = fade(t, 12.3, 12.8, 13.9, 14.2);

  // cursor and click ripples, mapped through the camera so they sit on the screen content
  const [x, y] = keyed(CUR, t), sx = c.tx + x * c.z, sy = c.ty + y * c.z;
  const press = CLICKS.reduce((m, k) => Math.max(m, 1 - Math.abs(t - k - .05) / .12), 0);
  $('cur').style.opacity = fade(t, 6.6, 7.0, 13.9, 14.3);
  $('cur').style.transform = `translate(${sx - 8}px,${sy - 5}px) scale(${1 - .14 * Math.max(0, press)})`;
  const last = CLICKS.filter(k => t >= k).pop(), rip = $('rip');
  if (last !== undefined && t - last < .55) {
    const u = (t - last) / .55;
    rip.style.opacity = (1 - u) * .9;
    rip.style.transform = `translate(${sx}px,${sy}px) scale(${.3 + out(u) * .9})`;
  } else rip.style.opacity = 0;

  // captions
  [[4.3, 8.4], [9.7, 13.5], [14.8, 18.7]].forEach(([a, b], i) => {
    const el = $('cap' + i), v = fade(t, a, a + .45, b - .35, b);
    el.style.opacity = v;
    el.style.transform = `translateY(${(1 - v) * 14}px)`;
  });
}

window.DURATION = DURATION;
window.POSTER = 5.9;               // frame used as the poster (zoomed into Total AR and DSO, caption up)
window.seek = t => { draw(t); return document.fonts.ready; };
window.reelReady = document.fonts.ready
  .then(() => Promise.all([...document.images].map(im => im.decode())))
  .then(() => { draw(0); return true; });
if (!location.search.includes('render')) {          // live preview in a browser: loop in real time
  const t0 = performance.now();
  window.reelReady.then(() => (function tick() { draw(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(tick); })());
}
</script>
</body>
</html>
